<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e8">
  <title>Sidequest</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button class="icon-button settings-button" id="settingsButton" type="button" aria-label="Open settings" aria-haspopup="dialog" aria-controls="settingsDialog">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M392.23-108.08 377-227.48q-16.58-5.41-34.67-15.35-18.1-9.94-31.46-21.02L201-217.77l-88.27-153.54 96-72.46q-1.57-8.59-2.06-17.1-.48-8.51-.48-18.75 0-7.73.73-16.94.74-9.21 2.12-21.29l-96.31-71.84L201-741.65l110.85 46.5q13.65-11.27 30.23-20.87 16.57-9.59 34.54-16.17l15.61-120.54h175.73l15.23 119.81q18.62 6.84 33.44 15.83 14.83 8.98 29.68 21.94l112.88-46.5 88.27 151.96-99.96 74.65q1.96 9.65 2.25 17.42.29 7.77.29 17.52 0 9.37-.39 17.53-.38 8.16-2.46 18.72l98.39 72.54-88.27 153.54-111-47.27q-13.73 11.54-28.54 20.35-14.81 8.8-34.58 16.8l-15.23 119.81H392.23Zm48.02-55.96h77.6l14.93-107.65q29.72-8 53.85-22.08 24.14-14.08 47.18-37.23l99.88 42.58 38.89-67.1L685-421q4.5-15.54 6.4-29.99 1.91-14.46 1.91-29.11 0-15.21-1.66-28.78-1.65-13.58-6.65-29.35l88.35-66.96-38.08-67.19-102.15 43.19q-18.16-19.85-46.2-36.31-28.04-16.46-54.61-23l-12.57-108.27h-79.12l-12.74 107.59q-31.61 7.72-55.51 21.18-23.91 13.46-48.56 37.81l-98.89-42.19-39.07 67.19 86.07 63.88q-5 15.04-7 30.05-2 15.01-2 31.11 0 15.03 1.75 29.53 1.75 14.5 6.37 30.43l-85.19 64.57 39.07 67.2 98.2-42q23.88 23.88 48.84 38 24.96 14.11 55.45 21.61l12.84 106.77Zm38.43-200q48.17 0 81.99-33.87 33.83-33.86 33.83-82.13 0-48.27-33.86-82.09-33.85-33.83-82.1-33.83-48.62 0-82.29 33.87-33.67 33.86-33.67 82.13 0 48.27 33.67 82.09 33.67 33.83 82.43 33.83Zm1.01-116.46Z"/></svg>
      </button>
      <div class="date-line" id="dateLine">MONDAY · 31 AUGUST</div>
      <div class="streak-line">
        <span id="streak">STREAK: DAY 0</span>
        <span class="divider">:</span>
        <span id="bestStreak">BEST 0</span>
      </div>
    </header>

    <section class="task-wrap">
      <button class="task-card" id="taskCard" type="button" aria-label="Reveal today's task">
        <span class="task-card-inner">
          <span class="task-face task-front">
            <span class="eyebrow">TODAY'S TASK</span>
            <span class="reveal-hint">TAP TO REVEAL</span>
          </span>
          <span class="task-face task-back">
            <span class="task" id="taskText">Loading today's activity…</span>
          </span>
        </span>
      </button>
    </section>

    <section class="actions" id="actions">
      <button class="primary" id="doneButton" type="button">I DID IT</button>
      <button class="secondary" id="skipButton" type="button">SKIP −4 CREDITS</button>
    </section>

    <footer class="credits">
      <span>TOTAL</span>
      <strong id="credits">0 CREDITS</strong>
    </footer>
  </main>

  <dialog class="settings-dialog" id="settingsDialog" aria-labelledby="settingsTitle" aria-describedby="settingsDescription">
    <div class="settings-heading">
      <h2 id="settingsTitle">Settings</h2>
      <button class="icon-button" id="closeSettingsButton" type="button" aria-label="Close settings" autofocus>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18"/>
        </svg>
      </button>
    </div>
    <p id="settingsDescription">Clear your completed quests, credits and streaks to start fresh.</p>
    <button class="clear-history-button" id="clearHistoryButton" type="button">CLEAR HISTORY</button>
    <p class="settings-status" id="settingsStatus" role="status"></p>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
